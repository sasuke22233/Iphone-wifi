name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analyze.txt 2>&1
          STATUS=$?
          cat /tmp/analyze.txt
          python3 - <<'PY'
          import re, os
          out = open('/tmp/analyze.txt', encoding='utf-8', errors='replace').read()
          for line in out.splitlines():
              m = re.match(r'\s*(error|warning|info)\s+•\s+(.+?)\s+•\s+(\S+?):(\d+):(\d+)\s+•\s+(\S+)', line)
              if m:
                  level, msg, f, l, c, rule = m.groups()
                  if level == 'info':
                      continue
                  msg = msg.replace('%', '%25').replace('\n', '%0A')
                  print(f"::error file={f},line={l},col={c},title={rule}::{msg}")
          PY
          exit $STATUS

      - name: Run tests
        run: |
          set +e
          flutter test > /tmp/test.txt 2>&1
          STATUS=$?
          cat /tmp/test.txt
          if [ $STATUS -ne 0 ]; then
            python3 - <<'PY'
          out = open('/tmp/test.txt', encoding='utf-8', errors='replace').read()
          tail = out[-5500:]
          tail = tail.replace('%', '%25').replace('\n', '%0A')
          print(f"::error title=flutter test::failed output follows: {tail}")
          PY
          fi
          exit $STATUS

  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check pbxproj balance and icons
        run: |
          python3 - <<'EOF'
          p = open('ios/Runner.xcodeproj/project.pbxproj').read()
          assert p.count('{') == p.count('}'), 'pbxproj braces'
          assert p.count('(') == p.count(')'), 'pbxproj parens'
          assert 'com.auravpn.app.packet-tunnel' in p
          import os
          assert os.path.exists('ios/Runner/Assets.xcassets/AppIcon.appiconset/icon-1024.png')
          print('project OK')
          EOF
