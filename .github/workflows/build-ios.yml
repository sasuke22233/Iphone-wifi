name: Build iOS IPA

# Собирает нативные ядра (Xray-core + hev-socks5-tunnel), приложение и
# не подписанный IPA для установки через Sideloadly.
#
# Триггеры:
#   - push тега v*  (например: git tag v1.0.0 && git push origin v1.0.0)
#   - ручной запуск: gh workflow run build-ios.yml -f tag=v1.0.0
# Если релиз с этим тегом существует — IPA автоматически прикладывается к нему.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the IPA to (optional)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache native cores
        id: cache-cores
        uses: actions/cache@v4
        with:
          path: |
            ios/Frameworks
            third_party
          key: cores-v1-${{ hashFiles('scripts/build_core.sh') }}

      - name: Build native cores (libXray + hev-socks5-tunnel)
        if: steps.cache-cores.outputs.cache-hit != 'true'
        run: ./scripts/build_core.sh

      - name: Flutter dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build IPA
        run: |
          set +e
          ./scripts/build_ipa.sh > /tmp/ipa_build.txt 2>&1
          STATUS=$?
          tail -n 300 /tmp/ipa_build.txt
          python3 - <<'PY'
          out = open('/tmp/ipa_build.txt', encoding='utf-8', errors='replace').read()
          def emit(title, text):
              text = text.strip()[:12000].replace('%', '%25').replace('\n', '%0A')
              if text:
                  print(f"::error title={title}::{text}")
          import re
          seen = 0
          for i, line in enumerate(out.splitlines()):
              if re.search(r'\berror[: ]', line, re.I) and 'warning' not in line.lower():
                  window = '\n'.join(out.splitlines()[i:i+8])
                  emit('xcodebuild', window)
                  seen += 1
                  if seen > 15:
                      break
          PY
          if [ $STATUS -ne 0 ]; then
            python3 - <<'PY'
          out = open('/tmp/ipa_build.txt', encoding='utf-8', errors='replace').read()
          tail = out[-8000:].replace('%', '%25').replace('\n', '%0A')
          print(f"::error title=build log tail::{tail}")
          PY
          fi
          exit $STATUS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraVPN-ipa
          path: AuraVPN.ipa
          if-no-files-found: error

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [ -n "$TAG" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AuraVPN.ipa --clobber
            echo "IPA attached to release $TAG"
          else
            echo "No release for '$TAG' — IPA uploaded as workflow artifact only"
          fi
